name: Repository checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Run repository gate
        env:
          CHECK_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: make check CHECK_ARGS=--ci

  console-build:
    name: Build Console artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install Console dependencies
        working-directory: portal/console
        run: npm ci

      - name: Build hosted and device Console targets
        working-directory: portal/console
        run: npm run build

      - name: Verify Console outputs and generated-header drift
        run: |
          test -d portal/console/dist-hosted
          test -s portal/console/dist-hosted/index.html
          test "$(find portal/console/dist-hosted -type f | wc -l)" -eq 1
          test -d portal/console/dist-device
          test -s portal/console/dist-device/index.html
          git diff --exit-code -- portal/console/dist-hosted/index.html firmware/dk01/web_console.h

  verify-production:
    name: Verify production artifact
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Prove pushed commit and deployed artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFY_BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'HEAD^' }}
          VERIFY_REPOSITORY: ${{ github.repository }}
          VERIFY_REQUIRE_DEPLOYMENT: "true"
        run: >-
          node scripts/verify-live.mjs
          --branch main
          --repository "$VERIFY_REPOSITORY"
          --deployment-base "$VERIFY_BASE_REF"
